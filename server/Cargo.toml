[package]
name = "sumo"
version = "0.1.0"
edition = "2024"
description = "Your Mac's processes and apps, wrestling in a sumo arena"
license = "MIT"
repository = "https://github.com/vikey89/Sumo"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
libc = "0.2"
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"
tokio = { version = "1.54.1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["cors"] }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
