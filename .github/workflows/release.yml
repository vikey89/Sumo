# On a v* tag: build sumo for Apple Silicon and Intel, publish the release and, when the
# HOMEBREW_TAP_TOKEN secret is set, update the formula in <owner>/homebrew-tap.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the crate version
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' server/Cargo.toml | head -1)
          test "v$crate" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME, crate $crate"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the arena
        run: npm ci && npm run build

      - name: Build sumo
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --manifest-path server/Cargo.toml --target "$target"
            tar -czf "sumo-${GITHUB_REF_NAME#v}-$target.tar.gz" -C "server/target/$target/release" sumo
          done
          shasum -a 256 sumo-*.tar.gz | tee checksums.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" sumo-*.tar.gz checksums.txt --generate-notes

      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        if: env.TAP_TOKEN != ''
        run: |
          version=${GITHUB_REF_NAME#v}
          arm=$(awk '/aarch64/ {print $1}' checksums.txt)
          intel=$(awk '/x86_64/ {print $1}' checksums.txt)
          git clone "https://x-access-token:$TAP_TOKEN@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          mkdir -p tap/Formula
          SUMO_REPO=$GITHUB_REPOSITORY packaging/homebrew/formula.sh "$version" "$arm" "$intel" > tap/Formula/sumo.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/sumo.rb
          git commit -m "sumo $version"
          git push
