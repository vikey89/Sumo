# On every push and pull request: type-check, lint and test the arena, then the engine.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arena:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Lint the shell scripts
        run: shellcheck install.sh packaging/*.sh packaging/homebrew/*.sh

  engine:
    # The engine reads macOS processes, so it is built and tested where it runs.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Build the arena the engine embeds
        run: npm ci && npx vite build
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --check --manifest-path server/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path server/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path server/Cargo.toml
      - name: The generated wire types match the engine
        run: git diff --exit-code src/generated && test -z "$(git ls-files --others --exclude-standard src/generated)"

  e2e:
    # Smoke test of the real engine and arena in Chromium; the engine reads macOS processes.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo build --release --locked --manifest-path server/Cargo.toml
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: The curl installer installs, checks the SHA-256 and uninstalls
        run: packaging/test-install.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
