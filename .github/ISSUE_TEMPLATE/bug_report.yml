name: Bug report
description: Something in the arena or the sumo command doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: sumo --version
      placeholder: sumo 0.1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 15.5, Apple M2
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed with
      options:
        - Homebrew
        - curl installer
        - Built from source
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser, if the arena is involved
      placeholder: Chrome 141
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The end of ~/Library/Logs/sumo.log, or the terminal output.
      render: text
